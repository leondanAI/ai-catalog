<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Purple glow behind logo -->
  <ellipse cx="600" cy="260" rx="180" ry="180" fill="#7c6af7" opacity="0.12"/>

  <!-- Logo box -->
  <rect x="520" y="140" width="160" height="160" rx="40" fill="#7c6af7"/>

  <!-- AI text -->
  <text x="600" y="242" font-family="'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="700" fill="#ffffff" text-anchor="middle">AI</text>

  <!-- AItoolFit wordmark -->
  <text x="600" y="360" font-family="'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" fill="#f0f0f0" text-anchor="middle" letter-spacing="-1">AItoolFit</text>

  <!-- Tagline -->
  <text x="600" y="415" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="400" fill="#888888" text-anchor="middle" letter-spacing="1">Find the right AI tool for any task</text>

  <!-- Bottom separator line -->
  <line x1="480" y1="460" x2="720" y2="460" stroke="#7c6af7" stroke-width="2" opacity="0.5"/>

  <!-- URL -->
  <text x="600" y="500" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="400" fill="#555555" text-anchor="middle">aitoolfit.ai</text>
</svg>
