<style>
  :root {
    --bg: #0a0a0a;
    --bg2: #141414;
    --bg3: #1c1c1c;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f0f0f0;
    --text2: #888;
    --text3: #555;
    --accent: #7c6af7;
    --accent2: #5b4de0;
    --green: #2dd4a0;
    --amber: #f59e0b;
    --radius: 12px;
    --radius-sm: 8px;
    --font: 'DM Sans', sans-serif;
    --font-display: 'Space Grotesk', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── HEADER ── */
  .site-header {
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 0 1.25rem;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .header-inner {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 1rem;
    height: 56px;
  }
  .logo {
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  .logo-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }
  .header-search {
    flex: 1;
    position: relative;
  }
  .header-search input {
    width: 100%;
    padding: 8px 14px 8px 36px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .header-search input::placeholder { color: var(--text3); }
  .header-search input:focus { border-color: var(--border2); }
  .search-ico {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text3);
    font-size: 14px;
    pointer-events: none;
  }

  /* ── HERO ── */
  .hero {
    max-width: 900px;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 1.5rem;
    text-align: center;
  }
  .hero-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(124,106,247,0.12);
    border: 1px solid rgba(124,106,247,0.25);
    color: #a89cf7;
    font-size: 12px;
    font-weight: 500;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 1rem;
    letter-spacing: 0.02em;
  }
  .hero h1 {
    font-family: var(--font-display);
    font-size: clamp(24px, 5vw, 40px);
    font-weight: 600;
    line-height: 1.2;
    margin-bottom: 0.75rem;
  }
  .hero h1 span { color: var(--accent); }
  .hero p {
    font-size: 15px;
    color: var(--text2);
    max-width: 480px;
    margin: 0 auto 1.5rem;
    line-height: 1.6;
  }
  .stats-row {
    display: flex;
    justify-content: center;
    gap: 2rem;
    padding-bottom: 0.5rem;
  }
  .stat { text-align: center; }
  .stat-n {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
  }
  .stat-l { font-size: 12px; color: var(--text3); margin-top: 2px; }

  /* ── CATEGORY TABS ── */
  .tabs-wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 1rem 1.25rem 0;
  }
  .tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 1rem;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text2);
    font-family: var(--font);
    font-size: 13px;
    font-weight: 400;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.15s;
  }
  .tab-btn:hover { border-color: var(--border2); color: var(--text); }
  .tab-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .tab-icon { font-size: 14px; }

  /* ── CATALOG ── */
  .catalog {
    max-width: 900px;
    margin: 0 auto;
    padding: 0.5rem 1.25rem 4rem;
  }

  .cat-section { margin-bottom: 2.5rem; }
  .cat-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 0.875rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid var(--border);
  }
  .cat-icon {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .cat-name {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 500;
  }
  .cat-count {
    margin-left: auto;
    font-size: 12px;
    color: var(--text3);
  }

  /* Tool cards grid */
  .tools-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 10px;
  }

  .tool-card {
    display: flex;
    flex-direction: column;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    text-decoration: none;
    color: inherit;
    transition: border-color 0.15s, background 0.15s, transform 0.15s;
    position: relative;
    overflow: hidden;
  }
  .tool-card:hover {
    border-color: var(--border2);
    background: var(--bg3);
    transform: translateY(-1px);
  }
  .tool-card-top {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .tool-avatar {
    width: 38px;
    height: 38px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 600;
    flex-shrink: 0;
    border: 1px solid var(--border);
    color: #fff;
  }
  .tool-title {
    font-family: var(--font-display);
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
  }
  .tool-badge {
    margin-left: auto;
    font-size: 10px;
    font-weight: 500;
    padding: 3px 8px;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .badge-free { background: rgba(45,212,160,0.12); color: var(--green); border: 1px solid rgba(45,212,160,0.2); }
  .badge-freemium { background: rgba(124,106,247,0.12); color: #a89cf7; border: 1px solid rgba(124,106,247,0.2); }
  .badge-paid { background: rgba(245,158,11,0.1); color: var(--amber); border: 1px solid rgba(245,158,11,0.2); }

  .tool-desc {
    font-size: 12.5px;
    color: var(--text2);
    line-height: 1.5;
    flex: 1;
  }
  .tool-link-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }
  .tool-domain {
    font-size: 11px;
    color: var(--text3);
  }
  .tool-arrow {
    font-size: 13px;
    color: var(--text3);
    transition: color 0.15s, transform 0.15s;
  }
  .tool-card:hover .tool-arrow { color: var(--accent); transform: translateX(2px); }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--text3);
    font-size: 14px;
  }

  /* ── FOOTER ── */
  .site-footer {
    border-top: 1px solid var(--border);
    padding: 1.5rem 1.25rem;
    text-align: center;
    font-size: 12px;
    color: var(--text3);
  }
  .site-footer span { color: var(--accent); }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    .hero { padding: 1.5rem 1rem 1rem; }
    .stats-row { gap: 1.25rem; }
    .tools-grid { grid-template-columns: 1fr; }
    .tabs-wrap { padding: 0.75rem 1rem 0; }
    .catalog { padding: 0.5rem 1rem 4rem; }
  }

  /* Fade-in animation */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .cat-section { animation: fadeUp 0.25s ease both; }
</style>
</head>

      { name:'Obviously AI', desc:'Предсказательная аналитика без кода. ML модели и прогнозы буквально за минуты.', url:'https://obviously.ai', badge:'paid' },
      { name:'Rows', desc:'Умные таблицы с AI. Импорт данных из любых источников и анализ прямо в браузере.', url:'https://rows.com', badge:'freemium' },
    ]
  }
];

let activeCat = 'all';
let searchQuery = '';

function getDomain(url) {
  try { return new URL(url).hostname.replace('www.', ''); } catch { return ''; }
}

function badgeLabel(b) {
  return b === 'free' ? 'Бесплатно' : b === 'freemium' ? 'Freemium' : 'Платно';
}

function buildTabs() {
  const row = document.getElementById('tabsRow');
  const all = [{ id: 'all', title: 'Все', icon: '✦' }, ...CATEGORIES];
  row.innerHTML = all.map(c =>
    `<button class="tab-btn ${c.id === 'all' ? 'active' : ''}" onclick="setTab('${c.id}', this)">
      <span class="tab-icon">${c.icon}</span>${c.title}
    </button>`
  ).join('');
}

function setTab(id, el) {
  activeCat = id;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  render();
}

function doSearch(val) {
  searchQuery = val.toLowerCase();
  render();
}

function render() {
  const wrap = document.getElementById('catalog');
  const cats = CATEGORIES.filter(c => activeCat === 'all' || c.id === activeCat);
  let html = '';

  cats.forEach(cat => {
    const tools = cat.tools.filter(t =>
      !searchQuery ||
      t.name.toLowerCase().includes(searchQuery) ||
      t.desc.toLowerCase().includes(searchQuery)
    );
    if (!tools.length) return;

    const cards = tools.map(t => `
      <a class="tool-card" href="${t.url}" target="_blank" rel="noopener noreferrer">
        <div class="tool-card-top">
          <div class="tool-avatar" style="background:${cat.color}22; border-color:${cat.color}33; color:${cat.color}">
            ${t.name[0]}
          </div>
          <span class="tool-title">${t.name}</span>
          <span class="tool-badge badge-${t.badge}">${badgeLabel(t.badge)}</span>
        </div>
        <p class="tool-desc">${t.desc}</p>
        <div class="tool-link-row">
          <span class="tool-domain">${getDomain(t.url)}</span>
          <span class="tool-arrow">&#8594;</span>
        </div>
      </a>
    `).join('');

    html += `
      <div class="cat-section">
        <div class="cat-header">
          <div class="cat-icon" style="background:${cat.color}22; color:${cat.color}">${cat.icon}</div>
          <span class="cat-name">${cat.title}</span>
          <span class="cat-count">${tools.length} инструментов</span>
        </div>
        <div class="tools-grid">${cards}</div>
      </div>
    `;
  });

  if (!html) {
    html = `<div class="empty">Ничего не найдено по запросу «${searchQuery}»</div>`;
  }

  wrap.innerHTML = html;
}

buildTabs();
render();
</script>
</body>
</html>
