<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Новости ИИ | AItoolFit</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://aitoolfit.ai/ru/news-article.html">
<script>
// Старый адрес статьи (news-article.html?slug=…&lang=…). Статьи давно печатаются
// в /news/<slug>.html и /<lang>/news/<slug>.html — сюда ведут только старые
// ссылки, их переправляем на напечатанную страницу.
(function () {
  var p = new URLSearchParams(location.search);
  var slug = (p.get('slug') || '').replace(/[^a-z0-9-]/gi, '');
  var langs = ['es', 'de', 'ru', 'ua', 'he', 'fr', 'pt'];
  var fromPath = location.pathname.split('/')[1];
  var lang = p.get('lang') || (langs.indexOf(fromPath) >= 0 ? fromPath : 'en');
  if (langs.indexOf(lang) < 0) lang = 'en';
  var prefix = lang === 'en' ? '' : '/' + lang;
  location.replace(slug ? prefix + '/news/' + slug + '.html' : prefix + '/news.html');
})();
</script>

</body>
